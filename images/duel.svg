<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Duel: the winner stays, the loser goes to the back of the queue</title>
  <rect width="960" height="300" fill="#0b0c0e"/>
  <defs>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c3f400"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff5a5f"/></marker>
  </defs>
  <rect x="30" y="40" width="350" height="150" fill="#1e2024" stroke="#c3f400" stroke-width="2"/>
  <text x="205" y="70" fill="#c3f400" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">ARENA · 1 VS 1</text>
  <rect x="55" y="95" width="130" height="56" fill="#2a2d32"/><text x="120" y="129" fill="#e6e1d3" font-size="18" font-weight="700" text-anchor="middle">Winner</text>
  <text x="205" y="129" fill="#b9b3a3" font-size="15" text-anchor="middle">vs</text>
  <rect x="225" y="95" width="130" height="56" fill="#2a2d32"/><text x="290" y="129" fill="#ff5a5f" font-size="18" font-weight="700" text-anchor="middle">Loser</text>
  <rect x="580" y="40" width="350" height="150" fill="#1e2024" stroke="#e6e1d3" stroke-opacity="0.35"/>
  <text x="755" y="70" fill="#e6e1d3" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">QUEUE · SPECTATING</text>
  <rect x="600" y="95" width="95" height="56" fill="#2a2d32"/><text x="647" y="129" fill="#c3f400" font-size="16" font-weight="700" text-anchor="middle">#1</text>
  <rect x="707" y="95" width="95" height="56" fill="#2a2d32"/><text x="754" y="129" fill="#e6e1d3" font-size="16" text-anchor="middle">#2</text>
  <rect x="814" y="95" width="95" height="56" fill="#2a2d32"/><text x="861" y="129" fill="#e6e1d3" font-size="16" text-anchor="middle">#3</text>
  <path d="M572 100 L390 100" stroke="#c3f400" stroke-width="3" fill="none" marker-end="url(#g)"/>
  <text x="481" y="90" fill="#c3f400" font-size="13" text-anchor="middle">#1 is called in</text>
  <path d="M390 146 L572 146" stroke="#ff5a5f" stroke-width="3" fill="none" marker-end="url(#r)"/>
  <text x="481" y="172" fill="#ff5a5f" font-size="13" text-anchor="middle">loser to the back</text>
  <text x="480" y="236" fill="#e6e1d3" font-size="15" text-anchor="middle">After every match the winner stays, the loser goes to the back of the queue and #1 gets 20 s to join.</text>
  <text x="480" y="264" fill="#b9b3a3" font-size="13" text-anchor="middle">Everyone waiting watches the duel. Joining a running duel puts you into the queue automatically.</text>
</svg>
