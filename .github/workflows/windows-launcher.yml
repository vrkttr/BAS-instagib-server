# Builds BAS-Instagib-Server.exe and publishes it as the latest GitHub release.
name: Windows launcher

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/windows-launcher.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
          cache-dependency-path: windows/go.sum

      - name: Version
        id: v
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Vet
        working-directory: windows
        env: { GOOS: windows, GOARCH: amd64 }
        run: go vet ./...

      - name: Build
        working-directory: windows
        env: { GOOS: windows, GOARCH: amd64, CGO_ENABLED: "0" }
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=v${{ steps.v.outputs.version }}" \
            -o ../dist/BAS-Instagib-Server.exe .
          cd ../dist && sha256sum BAS-Instagib-Server.exe > BAS-Instagib-Server.exe.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Windows server launcher v${{ steps.v.outputs.version }}
          make_latest: "true"
          body: |
            **BAS-Instagib-Server.exe** – runs a BAS: Instagib server on Windows with one double-click.

            1. Put the exe into an empty folder (e.g. `C:\BAS-Server`) and start it.
            2. Enter the settings on first start (saved in `config.env` next to the exe).
            3. Closing the window stops the server.

            Requires Windows 10 2004+ / Windows 11 with WSL2. Every start pulls a fresh copy of
            `ghcr.io/vrkttr/bas-instagib-server:latest`. See the README for details.
          files: |
            dist/BAS-Instagib-Server.exe
            dist/BAS-Instagib-Server.exe.sha256
