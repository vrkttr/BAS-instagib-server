# Builds the official game server image from the private source repository and publishes it to
# ghcr.io/vrkttr/bas-instagib-server. Runs in this public repository, where GitHub Actions is free.
name: Server image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or commit of vrkttr/BAS-instagib to build"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: server-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the game source
        uses: actions/checkout@v4
        with:
          repository: vrkttr/BAS-instagib
          ref: ${{ inputs.ref }}
          token: ${{ secrets.BAS_SOURCE_TOKEN }}
          path: source

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: vrkttr
          password: ${{ secrets.BAS_SOURCE_TOKEN }}

      - id: meta
        working-directory: source
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: source
          file: source/docker/Dockerfile
          target: game-server
          platforms: linux/amd64
          push: true
          build-args: BAS_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/vrkttr/bas-instagib-server:latest
            ghcr.io/vrkttr/bas-instagib-server:${{ steps.meta.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/vrkttr/bas-instagib-server
            org.opencontainers.image.revision=${{ steps.meta.outputs.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published ghcr.io/vrkttr/bas-instagib-server:latest (version ${{ steps.meta.outputs.version }}, ${{ steps.meta.outputs.short }})" >> "$GITHUB_STEP_SUMMARY"
